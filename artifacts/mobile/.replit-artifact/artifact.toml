kind = "mobile"
previewPath = "/mobile/"
title = "Bubble Pop"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "EXPO_DEV_DOMAIN=$REPLIT_EXPO_DEV_DOMAIN APP_DEV_DOMAIN=$REPLIT_DEV_DOMAIN APP_ID=$REPL_ID INTERNAL_APP_DOMAIN=$REPLIT_INTERNAL_APP_DOMAIN pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
